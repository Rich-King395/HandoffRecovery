name: Offline Harness checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install framework and model-client dependencies
        # CLI tests also use the YAML reader supplied by HandoffBench in real runs.
        run: python -m pip install -e '.[cloud-agents]' 'PyYAML==6.0.2'
      - name: Validate installed dependencies
        run: python -m pip check
      - name: Run standalone unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/unit -v
