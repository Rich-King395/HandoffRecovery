name: Public file boundary

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test public-boundary tooling
        run: python -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Check public candidate files
        run: python tools/check_public_boundary.py --root .
